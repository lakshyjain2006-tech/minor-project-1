<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood-Bridge | Donor Registration</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Navbar CSS -->
    <link rel="stylesheet" href="/css/navbar.css">

    <!-- Our CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                💧 Blood-<span>Bridge</span>
            </div>

            <p class="subtitle">
                Connecting blood donors with people in emergencies
            </p>
        </header>


        <!-- MAIN CARD -->
        <main class="card">

            <h2>🩸 Become a Donor</h2>


            <!-- DONOR FORM -->
            <form id="donorForm">

                <!-- NAME -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <!-- PHONE -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="10-digit phone number"
                        pattern="[6-9][0-9]{9}"
                        inputmode="numeric"
                        maxlength="10"
                        title="Enter a valid 10-digit Indian mobile number starting with 6, 7, 8, or 9"
                        required
                    >
                </div>


                <!-- BLOOD + AGE -->
                <div class="row">

                    <div class="form-group">
                        <label for="bloodGroup">
                            Blood Group
                        </label>

                        <select id="bloodGroup" required>
                            <option value="">
                                Select Blood Group
                            </option>

                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="age">Age</label>

                        <input
                            type="number"
                            id="age"
                            placeholder="18 - 65"
                            min="18"
                            max="65"
                            inputmode="numeric"
                            required
                        >
                    </div>

                </div>


                <!-- GENDER -->
                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender">

                        <option value="">
                            Select Gender
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>

                <!-- DONOR ELIGIBILITY -->
                <div class="row">

                    <div class="form-group">

                        <label for="weight">
                            Weight (kg)
                        </label>

                        <input
                            type="number"
                            id="weight"
                            placeholder="Minimum 45 kg"
                            min="45"
                            max="250"
                            inputmode="numeric"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="lastDonationDate">
                            Last Donation Date
                        </label>

                        <input
                            type="date"
                            id="lastDonationDate"
                        >

                        <small>
                            Leave empty if you have never donated.
                        </small>

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Health Eligibility
                    </label>

                    <label style="display:flex;align-items:center;gap:8px;">

                        <input
                            type="checkbox"
                            id="healthEligible"
                        >

                        I confirm that I am currently healthy
                        and eligible to donate blood.

                    </label>

                </div>


                <!-- LOCATION -->
                <section class="location-section">

                    <h3>📍 Your Location</h3>


                    <!-- SEARCH -->
                    <div class="location-search">

                        <input
                            type="text"
                            id="locationSearch"
                            placeholder="🔎 Search your location..."
                            autocomplete="off"
                        >

                        <div
                            id="searchSuggestions"
                            class="search-suggestions">
                        </div>

                    </div>


                    <!-- GPS BUTTON -->
                    <button
                        type="button"
                        class="location-btn"
                        id="locationButton"
                    >
                        📍 Use My Location
                    </button>


                    <!-- LOCATION STATUS -->
                    <div
                        class="location-status"
                        id="locationStatus"
                    >
                        Location not selected
                    </div>


                    <!-- MAP -->
                    <div id="map"></div>


                    <p class="map-help">
                        💡 Search for a place, use your location,
                        or click anywhere on the map.
                    </p>

                </section>


                <!-- REGISTER -->
                <button
                    type="submit"
                    class="register-btn"
                    id="registerButton"
                >
                    Register as Donor
                </button>

            </form>


            <!-- RESULT -->
            <div id="result"></div>

        </main>


        <!-- FOOTER -->
        <footer class="footer">
            Blood-Bridge © 2026 | Emergency Blood Donor Network
        </footer>

    </div>


    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Navbar JS -->
    <script src="/js/navbar.js"></script>

    <!-- Our JS -->
    <script src="/js/app.js"></script>

</body>

</html>
