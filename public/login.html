<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blood-Bridge | Login</title>

    <link
        rel="stylesheet"
        href="/css/login.css"
    >

    <link rel="stylesheet" href="/css/navbar.css">

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="logo">
                🩸
            </div>

            <h1>
                Blood-Bridge
            </h1>

            <p class="subtitle">
                Donor Login
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    🔐 Login
                </button>

            </form>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- REGISTER -->

            <div class="register-section">

                <p>
                    Don't have an account?
                </p>

                <a href="/register.html">
                    Create Donor Account
                </a>

            </div>

        </div>

    </div>


    <!-- NAVBAR -->

    <script src="/js/navbar.js"></script>


    <!-- FIREBASE -->

    <script
        type="module"
        src="/js/login.js"
    ></script>

</body>

</html>
